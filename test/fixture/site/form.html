<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Formulario de postulación</title>
<style>body{font-family:system-ui;max-width:720px;margin:40px auto;line-height:1.5}label{display:block;margin-top:18px;font-weight:600}input,textarea,select{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px}textarea{min-height:120px}</style>
</head><body>
<h1>Postulación — Programa Demo</h1>
<form>
  <label for="q1">¿Cuál es el problema que resuelven?</label>
  <textarea id="q1"></textarea>

  <label for="q2">¿Cómo lo resuelven? Describí el producto.</label>
  <textarea id="q2"></textarea>

  <label for="q3">¿Qué tracción tienen hoy?</label>
  <input id="q3" type="text" />

  <label for="q4">¿Quiénes son sus clientes y cómo ganan dinero?</label>
  <textarea id="q4"></textarea>

  <label for="q5">Sitio web</label>
  <input id="q5" type="text" />

  <label for="q6">¿Cuál es el mercado y por qué ahora?</label>
  <textarea id="q6"></textarea>

  <button type="submit">Enviar</button>
</form>
</body></html>
